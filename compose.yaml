services:
  xui-network-console:
    build: .
    container_name: xui-network-console
    restart: unless-stopped
    environment:
      XUI_USERNAME: ${XUI_USERNAME:-}
      XUI_PASSWORD: ${XUI_PASSWORD:-}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:-}
      COLLECTOR_TOKEN_J4: ${COLLECTOR_TOKEN_J4:-}
      COLLECTOR_TOKEN_T4: ${COLLECTOR_TOKEN_T4:-}
      COLLECTOR_TOKEN_WF2: ${COLLECTOR_TOKEN_WF2:-}
      COLLECTOR_TOKEN_T1: ${COLLECTOR_TOKEN_T1:-}
      COLLECTOR_TOKEN_W0: ${COLLECTOR_TOKEN_W0:-}
      COLLECTOR_TOKEN_J2: ${COLLECTOR_TOKEN_J2:-}
    volumes:
      - ./.env:/app/dist/server/.dev.vars:ro
    expose:
      - "8787"

  auth-gateway:
    image: nginx:1.27-alpine
    container_name: xui-network-console-auth
    restart: unless-stopped
    depends_on:
      - xui-network-console
    ports:
      - "8787:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/xui-network-console-secrets/htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/xui-network-console-secrets/session-map.conf:/etc/nginx/conf.d/00-session-map.conf:ro
